name: Daily India stock signal scan

on:
  schedule:
    # 04:00 UTC = 9:30 AM IST. GitHub Actions cron is always UTC.
    - cron: '0 4 * * 1-5'   # weekdays only (Indian markets closed Sat/Sun)
  workflow_dispatch:        # lets you also trigger it manually from the GitHub UI

permissions:
  contents: write

jobs:
  run-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run the model
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python india_stock_model.py

      - name: Commit updated signals file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add india_stock_signals.json
          git diff --staged --quiet || git commit -m "Daily signal update $(date -u +'%Y-%m-%d')"
          git push
